<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70d6ff" />
      <stop offset="40%" stop-color="#38b6ff" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="235" fill="url(#metalGrad)" stroke="url(#goldGrad)" stroke-width="10" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Crossed Cue Sticks -->
  <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="80" y1="420" x2="420" y2="80" />
    <line x1="420" y1="420" x2="80" y2="80" />
  </g>
  <!-- Cue tips / details -->
  <circle cx="420" cy="80" r="8" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="80" cy="80" r="8" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Center Billiards Ball 8 -->
  <circle cx="250" cy="235" r="95" fill="#111111" stroke="url(#goldGrad)" stroke-width="5" />
  <!-- Gloss highlight on 8-ball -->
  <ellipse cx="225" cy="185" rx="40" ry="22" fill="#FFFFFF" opacity="0.25" transform="rotate(-25, 225, 185)" />
  <!-- White circle on 8-ball -->
  <circle cx="250" cy="235" r="46" fill="#FFFFFF" />
  <!-- Number 8 -->
  <text x="250" y="258" font-family="'Impact', 'Arial Black', sans-serif" font-size="70" font-weight="900" fill="#111111" text-anchor="middle">8</text>

  <!-- Brand Banner Ribbon -->
  <path d="M 60,330 L 440,330 L 415,385 L 85,385 Z" fill="#0A0A0A" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- THE WALL CUE Text in Banner -->
  <text x="250" y="372" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-size="40" font-weight="900" letter-spacing="3" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">THE WALL CUE</text>

  <!-- Subtitle Text -->
  <text x="250" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" letter-spacing="8" fill="#FFFFFF" text-anchor="middle">BILLIARDS</text>

  <!-- Decorative Stars -->
  <polygon points="250,95 255,108 268,108 258,116 261,128 250,121 239,128 242,116 232,108 245,108" fill="url(#goldGrad)" />
  <polygon points="190,110 194,120 205,120 196,127 199,137 190,131 181,137 184,127 175,120 186,120" fill="url(#goldGrad)" />
  <polygon points="310,110 314,120 325,120 316,127 319,137 310,131 301,137 304,127 295,120 306,120" fill="url(#goldGrad)" />
</svg>
